<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SelectSGS Web | Project Information</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            background: #f4f6f8;
            color: #263746;
            font-family: Arial, sans-serif;
        }

        main {
            width: min(100%, 900px);
            margin: 0 auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, .1);
        }

        h1 {
            margin-top: 0;
            color: #004f9f;
        }

        .intro {
            margin-bottom: 24px;
            color: #53677a;
        }

        form {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px 24px;
        }

        .field {
            min-width: 0;
        }

        .field-wide {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .required {
            color: #a12622;
        }

        input,
        select,
        textarea {
            width: 100%;
            min-height: 42px;
            padding: 9px 10px;
            border: 1px solid #8797a5;
            border-radius: 3px;
            background: white;
            color: inherit;
            font: inherit;
        }

        textarea {
            min-height: 76px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: 2px solid #7db3e6;
            outline-offset: 1px;
        }

        button {
            grid-column: 1 / -1;
            justify-self: start;
            margin-top: 4px;
            padding: 12px 20px;
            border: 0;
            border-radius: 3px;
            background: #004f9f;
            color: white;
            font: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #003a75;
        }

        #form-error {
            grid-column: 1 / -1;
            margin: 0;
            color: #a12622;
        }

        .unit-list {
            margin-top: 30px;
        }

        .unit-list h2 {
            color: #004f9f;
        }

        .unit-list-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(260px, .7fr);
            align-items: start;
            gap: 20px;
        }

        .unit-table-wrapper {
            overflow-x: auto;
        }

        .unit-list table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .unit-list th,
        .unit-list td {
            border: 1px solid #53677a;
            padding: 3px;
        }

        .unit-list th {
            background: #d6d6d6;
            font-weight: normal;
        }

        .unit-list th:first-child,
        .unit-list td:first-child {
            width: 32px;
            text-align: center;
        }

        .unit-list th:last-child,
        .unit-list td:last-child {
            width: 100px;
            text-align: right;
        }

        .unit-list td:first-child {
            background: #f1c48f;
        }

        .unit-list td input {
            display: block;
            width: 100%;
            min-width: 0;
            min-height: 27px;
            padding: 3px 6px;
            border: 0;
            border-radius: 0;
        }

        .unit-list .select-unit {
            display: block;
            width: 100%;
            min-height: 27px;
            margin: 0;
            padding: 4px 2px;
            border: 0;
            border-radius: 0;
            background: transparent;
            color: #17212a;
            font: inherit;
            text-align: center;
            text-decoration: underline;
        }

        .unit-list .select-unit:hover {
            background: #dceeff;
            color: #003a75;
        }

        .unit-details {
            padding: 18px;
            border-left: 5px solid #004f9f;
            background: #eef5ff;
        }

        .unit-details h3 {
            margin: 0 0 14px;
            color: #004f9f;
        }

        .unit-details dl {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
            gap: 10px 14px;
            margin: 0;
        }

        .unit-details dt {
            font-weight: bold;
        }

        .unit-details dd {
            margin: 0;
            overflow-wrap: anywhere;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            main {
                padding: 20px;
            }

            form {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .field-wide,
            button,
            #form-error {
                grid-column: auto;
            }

            .unit-list-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<main>
    <h1>Project Information</h1>
    <p class="intro">Enter the project details before selecting equipment.</p>

    <form id="project-form">
        <div class="field">
            <label for="customer">Customer <span class="required" aria-hidden="true">*</span></label>
            <input id="customer" name="customer" type="text" autocomplete="organization" required>
        </div>
        <div class="field">
            <label for="project-name">Project Name <span class="required" aria-hidden="true">*</span></label>
            <input id="project-name" name="projectName" type="text" required>
        </div>
        <div class="field">
            <label for="contact">Contact <span class="required" aria-hidden="true">*</span></label>
            <input id="contact" name="contact" type="text" autocomplete="name" required>
        </div>
        <div class="field">
            <label for="quote-number">Quote # <span class="required" aria-hidden="true">*</span></label>
            <input id="quote-number" name="quoteNumber" type="text" required>
        </div>
        <div class="field">
            <label for="prepared-by">Prepared by <span class="required" aria-hidden="true">*</span></label>
            <input id="prepared-by" name="preparedBy" type="text" autocomplete="name" required>
        </div>
        <div class="field">
            <label for="project-type">New/Replacement <span class="required" aria-hidden="true">*</span></label>
            <select id="project-type" name="projectType" required>
                <option value="">Select project type</option>
                <option>New</option>
                <option>Replacement</option>
            </select>
        </div>
        <div class="field">
            <label for="expected-close">Exp. Close <span class="required" aria-hidden="true">*</span></label>
            <input id="expected-close" name="expectedClose" type="date" required>
        </div>
        <div class="field">
            <label for="probability">Probability <span class="required" aria-hidden="true">*</span></label>
            <select id="probability" name="probability" required>
                <option value="">Select probability</option>
                <option value="0">0%</option>
                <option value="10">10%</option>
                <option value="20">20%</option>
                <option value="30">30%</option>
                <option value="40">40%</option>
                <option value="50">50%</option>
                <option value="60">60%</option>
                <option value="70">70%</option>
                <option value="80">80%</option>
                <option value="90">90%</option>
                <option value="100">100%</option>
            </select>
        </div>
        <div class="field field-wide">
            <label for="probability-comment">Prob. comment</label>
            <textarea id="probability-comment" name="probabilityComment"></textarea>
        </div>
        <div class="field">
            <label for="bid-status">Bid Status</label>
            <select id="bid-status" name="bidStatus">
                <option value="">Select bid status</option>
                <option>Not started</option>
                <option>In progress</option>
                <option>Submitted</option>
                <option>Won</option>
                <option>Lost</option>
            </select>
        </div>
        <div class="field field-wide">
            <label for="bid-status-comment">Bid Status cmt.</label>
            <textarea id="bid-status-comment" name="bidStatusComment"></textarea>
        </div>
        <div class="field field-wide">
            <label for="opportunity-number">Opportunity #</label>
            <input id="opportunity-number" name="opportunityNumber" type="text">
        </div>
        <p id="form-error" role="alert" hidden></p>
    </form>

    <section id="unit-list" class="unit-list" aria-labelledby="unit-list-heading" hidden>
        <h2 id="unit-list-heading">Select Units</h2>
        <div class="unit-list-layout">
            <div class="unit-table-wrapper">
                <table>
                    <thead>
                        <tr><th scope="col">#</th><th scope="col">Location</th><th scope="col">Unit Tag</th><th scope="col">Unit Type</th><th scope="col">Unit Price</th></tr>
                    </thead>
                    <tbody>
                        <tr data-unit-row="1"><th scope="row">1</th><td><input data-unit-field="location" aria-label="Location for unit 1"></td><td><input data-unit-field="tag" aria-label="Unit tag for unit 1"></td><td><button class="select-unit" type="button">Click to Select</button></td><td data-unit-price>—</td></tr>
                        <tr data-unit-row="2"><th scope="row">2</th><td><input data-unit-field="location" aria-label="Location for unit 2"></td><td><input data-unit-field="tag" aria-label="Unit tag for unit 2"></td><td><button class="select-unit" type="button">Click to Select</button></td><td data-unit-price>—</td></tr>
                        <tr data-unit-row="3"><th scope="row">3</th><td><input data-unit-field="location" aria-label="Location for unit 3"></td><td><input data-unit-field="tag" aria-label="Unit tag for unit 3"></td><td><button class="select-unit" type="button">Click to Select</button></td><td data-unit-price>—</td></tr>
                        <tr data-unit-row="4"><th scope="row">4</th><td><input data-unit-field="location" aria-label="Location for unit 4"></td><td><input data-unit-field="tag" aria-label="Unit tag for unit 4"></td><td><button class="select-unit" type="button">Click to Select</button></td><td data-unit-price>—</td></tr>
                        <tr data-unit-row="5"><th scope="row">5</th><td><input data-unit-field="location" aria-label="Location for unit 5"></td><td><input data-unit-field="tag" aria-label="Unit tag for unit 5"></td><td><button class="select-unit" type="button">Click to Select</button></td><td data-unit-price>—</td></tr>
                        <tr data-unit-row="6"><th scope="row">6</th><td><input data-unit-field="location" aria-label="Location for unit 6"></td><td><input data-unit-field="tag" aria-label="Unit tag for unit 6"></td><td><button class="select-unit" type="button">Click to Select</button></td><td data-unit-price>—</td></tr>
                        <tr data-unit-row="7"><th scope="row">7</th><td><input data-unit-field="location" aria-label="Location for unit 7"></td><td><input data-unit-field="tag" aria-label="Unit tag for unit 7"></td><td><button class="select-unit" type="button">Click to Select</button></td><td data-unit-price>—</td></tr>
                        <tr data-unit-row="8"><th scope="row">8</th><td><input data-unit-field="location" aria-label="Location for unit 8"></td><td><input data-unit-field="tag" aria-label="Unit tag for unit 8"></td><td><button class="select-unit" type="button">Click to Select</button></td><td data-unit-price>—</td></tr>
                    </tbody>
                </table>
            </div>
            <aside id="unit-details" class="unit-details" aria-labelledby="unit-details-heading">
                <h3 id="unit-details-heading">Selected Line Item</h3>
                <p id="unit-details-empty">Add a unit to a quote to see its specifications here.</p>
                <dl id="unit-details-list" hidden></dl>
            </aside>
        </div>
    </section>
</main>
<script>
const projectForm = document.getElementById("project-form");
const projectFields = [...projectForm.elements].filter(element => element.name);
const formError = document.getElementById("form-error");
const unitList = document.getElementById("unit-list");
const unitRows = [...document.querySelectorAll("[data-unit-row]")];
let quotedUnits = {};
const requestedUnitNumber = Number(new URLSearchParams(window.location.search).get("unit"));
const activeUnitNumber = Number.isInteger(requestedUnitNumber) && requestedUnitNumber >= 1 && requestedUnitNumber <= 8
    ? requestedUnitNumber
    : null;

function formatCurrency(value) {
    return new Intl.NumberFormat(undefined, { style: "currency", currency: "USD" }).format(value);
}

function renderUnitDetails(unitNumber) {
    const unit = quotedUnits[unitNumber];
    const unitRow = unitRows[unitNumber - 1];
    const details = document.getElementById("unit-details-list");
    const emptyMessage = document.getElementById("unit-details-empty");
    details.replaceChildren();

    if (!unit) {
        details.hidden = true;
        emptyMessage.hidden = false;
        return;
    }

    const fields = [
        ["Location", unitRow ? unitRow.querySelector('[data-unit-field="location"]').value : unit.location],
        ["Unit tag", unitRow ? unitRow.querySelector('[data-unit-field="tag"]').value : unit.tag],
        ["Model", unit.model],
        ["Unit price", formatCurrency(unit.price)],
        ["Required capacity", `${unit.requiredCapacity.toLocaleString()} MBH`],
        ["Capacity match", `${unit.capacityPercent.toFixed(1)}%`],
        ["Base HOR", `${unit.baseHor.toLocaleString()} MBH`],
        ["Corrected HOR", `${unit.correctedHor.toLocaleString()} MBH`],
        ["Refrigerant", unit.refrigerant],
        ["Motor voltage", unit.motorVoltage],
        ["Fan motor", `${unit.fanMotor} HP`],
        ["Air flow", `${unit.airFlowCfm?.toLocaleString() ?? "N/A"} CFM`],
        ["Internal coil volume", `${unit.internalCoilVolume ?? "N/A"} ft³`],
        ["R717 charge", `${unit.r717ChargeLb ?? "N/A"} lb`],
        ["Condensing temperature", `${unit.condensingTemperature} °F`],
        ["Wet bulb temperature", `${unit.wetBulbTemperature} °F`]
    ];

    for (const [label, value] of fields) {
        const term = document.createElement("dt");
        term.textContent = label;
        const description = document.createElement("dd");
        description.textContent = value ?? "—";
        details.append(term, description);
    }

    emptyMessage.hidden = true;
    details.hidden = false;
}

function getProjectData() {
    return Object.fromEntries(new FormData(projectForm).entries());
}

function getUnitData() {
    return unitRows.map(row => ({
        location: row.querySelector('[data-unit-field="location"]').value,
        tag: row.querySelector('[data-unit-field="tag"]').value
    }));
}

function saveProjectData() {
    try {
        sessionStorage.setItem("selectsgs-project", JSON.stringify(getProjectData()));
        sessionStorage.setItem("selectsgs-unit-rows", JSON.stringify(getUnitData()));
        formError.hidden = true;
        return true;
    } catch (error) {
        formError.textContent = "Project information could not be saved in this browser. Check your browser storage settings and try again.";
        formError.hidden = false;
        console.error("Could not save project information.", error);
        return false;
    }
}

function updateUnitList() {
    unitList.hidden = !projectForm.checkValidity();
}

try {
    const savedProject = sessionStorage.getItem("selectsgs-project");
    if (savedProject) {
        const project = JSON.parse(savedProject);
        for (const field of projectFields) {
            if (Object.hasOwn(project, field.name)) {
                field.value = project[field.name];
            }
        }
    }

    const savedUnitRows = sessionStorage.getItem("selectsgs-unit-rows");
    if (savedUnitRows) {
        const unitData = JSON.parse(savedUnitRows);
        if (Array.isArray(unitData)) {
            unitRows.forEach((row, index) => {
                const savedRow = unitData[index];
                if (!savedRow || typeof savedRow !== "object") return;
                row.querySelector('[data-unit-field="location"]').value = savedRow.location ?? "";
                row.querySelector('[data-unit-field="tag"]').value = savedRow.tag ?? "";
            });
        }
    }

    const savedQuotedUnits = JSON.parse(sessionStorage.getItem("selectsgs-quoted-units") || "{}");
    if (savedQuotedUnits && typeof savedQuotedUnits === "object" && !Array.isArray(savedQuotedUnits)) {
        quotedUnits = savedQuotedUnits;
    }
} catch (error) {
    formError.textContent = "Saved project information could not be loaded. You can still enter the details again.";
    formError.hidden = false;
    console.error("Could not load saved project information.", error);
}

for (const field of projectFields) {
    field.addEventListener("input", () => {
        saveProjectData();
        updateUnitList();
    });
    field.addEventListener("change", () => {
        saveProjectData();
        updateUnitList();
    });
}

for (const row of unitRows) {
    const unitNumber = row.dataset.unitRow;
    const quotedUnit = quotedUnits[unitNumber];
    if (quotedUnit) {
        row.querySelector("[data-unit-price]").textContent = formatCurrency(quotedUnit.price);
        row.querySelector(".select-unit").textContent = "Change Unit";
    }

    row.addEventListener("click", event => {
        if (event.target.closest("input, button")) return;
        renderUnitDetails(unitNumber);
    });

    for (const field of row.querySelectorAll("[data-unit-field]")) {
        field.addEventListener("input", () => {
            saveProjectData();
            if (Number(activeUnitNumber) === Number(unitNumber)) renderUnitDetails(unitNumber);
        });
        field.addEventListener("change", () => {
            saveProjectData();
            if (Number(activeUnitNumber) === Number(unitNumber)) renderUnitDetails(unitNumber);
        });
    }

    row.querySelector(".select-unit").addEventListener("click", () => {
        if (!projectForm.checkValidity()) {
            updateUnitList();
            return;
        }
        if (!saveProjectData()) return;

        const unitNumber = row.dataset.unitRow;
        window.location.href = `unit-selection.html?unit=${unitNumber}`;
    });
}

if (activeUnitNumber) {
    renderUnitDetails(activeUnitNumber);
}

updateUnitList();
</script>
</body>
</html>
