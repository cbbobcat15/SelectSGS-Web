function interpolateFromPoints(points, value) {
    let lowerIndex = 0;
    const upperIndex = points.findIndex(point => point.x >= value);

    if (upperIndex === -1) {
        lowerIndex = points.length - 2;
    } else if (upperIndex > 0) {
        lowerIndex = upperIndex - 1;
    }

    const lower = points[lowerIndex];
    const upper = points[lowerIndex + 1];
    const proportion = (value - lower.x) / (upper.x - lower.x);
    return lower.y + proportion * (upper.y - lower.y);
}

function getCorrectionFactor(condensingTemperature, wetBulbTemperature) {
    const factorsByCondensingTemperature = correctionFactorRows.map(row => {
        const points = row.factors
            .map((factor, index) => ({ x: wetBulbTemperatures[index], y: factor }))
            .filter(point => point.y !== null);
        return {
            x: row.condensingTemperature,
            y: interpolateFromPoints(points, wetBulbTemperature)
        };
    });

    return interpolateFromPoints(factorsByCondensingTemperature, condensingTemperature);
}

function findUnit() {

    const capacity = Number(document.getElementById("Capacity").value);
    const condensingTemperatureInput = document.getElementById("Condensing Temperature").value;
    const wetBulbTemperatureInput = document.getElementById("Wet Bulb Temperature").value;
    const condensingTemperature = Number(condensingTemperatureInput);
    const wetBulbTemperature = Number(wetBulbTemperatureInput);
    const lowerTolerance = Number(document.getElementById("Lower Tolerance").value);
    const upperTolerance = Number(document.getElementById("Upper Tolerance").value);
    const result = document.getElementById("result");

    if (!Number.isFinite(capacity) || capacity <= 0 ||
        condensingTemperatureInput.trim() === "" || !Number.isFinite(condensingTemperature) ||
        wetBulbTemperatureInput.trim() === "" || !Number.isFinite(wetBulbTemperature) ||
        !Number.isFinite(lowerTolerance) || !Number.isFinite(upperTolerance) ||
        lowerTolerance < -100 || lowerTolerance > 0 ||
        upperTolerance < 0 || lowerTolerance > upperTolerance) {
        result.textContent =
            "Enter a capacity greater than zero, valid CT and WB values, a lower tolerance from -100% to 0%, and a nonnegative upper tolerance.";
        return;
    }

    const correctionFactor = getCorrectionFactor(condensingTemperature, wetBulbTemperature);
    const minimumCapacity = capacity * (1 + lowerTolerance / 100);
    const maximumCapacity = capacity * (1 + upperTolerance / 100);
    const matchingUnits = units
        .map(unit => {
            const correctedHor = unit.baseHor * correctionFactor;
            const correctedCapacity = correctedHor * 1000;
            return {
                ...unit,
                correctedHor,
                capacityPercent: correctedCapacity / capacity * 100
            };
        })
        .filter(unit =>
            unit.correctedHor * 1000 >= minimumCapacity &&
            unit.correctedHor * 1000 <= maximumCapacity
        )
        .sort((a, b) => a.capacityPercent - b.capacityPercent);

    result.innerHTML = `
        <h3>Matching Units</h3>
        <p>Capacity range: ${minimumCapacity.toLocaleString()}–${maximumCapacity.toLocaleString()} BTUH</p>
        <p>Correction factor: ${correctionFactor.toFixed(3)}</p>
        ${matchingUnits.length
            ? `<table>
                <thead><tr><th>Model</th><th>Fan Motor (hp)</th><th>Base HOR (MBH)</th><th>Corrected HOR (MBH)</th><th>Capacity (%)</th></tr></thead>
                <tbody>${matchingUnits.map(unit =>
                    `<tr><td>${unit.model}</td><td>${unit.fanMotor}</td><td>${unit.baseHor.toLocaleString(undefined, { maximumFractionDigits: 1 })}</td><td>${unit.correctedHor.toLocaleString(undefined, { maximumFractionDigits: 1 })}</td><td>${unit.capacityPercent.toFixed(1)}%</td></tr>`
                ).join("")}</tbody>
            </table>`
            : "<p>No units match the selected capacity range.</p>"}
    `;
}
