<!DOCTYPE html>
<html>
<head>
    <title>SelectSGS Web | Unit Selection</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 24px;
        }

        .container {
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,.1);
        }

        h1 {
            color: #004f9f;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 20%;
            min-width: 180px;
            max-width: 100%;
            padding: 10px;
            margin-top: 5px;
        }

        button {
            display: block;
            margin-top: 25px;
            padding: 12px 20px;
            background-color: #004f9f;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #003a75;
        }

        .action-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: 25px;
        }

        .action-bar button {
            margin-top: 0;
        }

        #add-to-quote {
            margin-left: auto;
        }

        #add-to-quote:disabled {
            background: #8797a5;
            cursor: not-allowed;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background-color: #eef5ff;
            border-left: 5px solid #004f9f;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border-top: 1px solid #9aa8b5;
            border-bottom: 1px solid #9aa8b5;
            padding: 8px;
            text-align: center;
        }

        tbody tr {
            cursor: pointer;
        }

        tbody tr:hover {
            background: #eef5ff;
        }

        tbody tr[aria-selected="true"] {
            background: #cce2f8;
            outline: 2px solid #004f9f;
            outline-offset: -2px;
        }

        tbody tr:focus-visible {
            outline: 2px solid #004f9f;
            outline-offset: -2px;
        }

        thead th {
            border-top: 0;
            border-bottom: 2px solid #53677a;
            font-size: calc(1em + 2pt);
        }

        thead th button {
            display: inline;
            width: auto;
            margin: 0;
            padding: 0;
            border: 0;
            background: transparent;
            color: inherit;
            font: inherit;
            cursor: pointer;
        }

        thead th button:hover {
            background: transparent;
            text-decoration: underline;
        }

        th:first-child,
        td:first-child {
            text-align: left;
        }

        .table-unit {
            display: block;
            font-weight: normal;
        }

        .project-summary {
            margin: 20px 0;
            padding: 16px;
            background: #eef5ff;
            border-left: 5px solid #004f9f;
        }

        .project-summary h2 {
            margin-top: 0;
            color: #004f9f;
        }

        .project-summary dl {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin: 0;
        }

        .project-summary dt {
            font-weight: bold;
        }

        .project-summary dd {
            margin: 4px 0 0;
            overflow-wrap: anywhere;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>

<div class="container">
    <h1>SelectSGS Web</h1>
    <p id="unit-selection-target" hidden></p>
    <section id="project-summary" class="project-summary" aria-labelledby="project-heading" hidden>
        <h2 id="project-heading">Project Information</h2>
        <dl id="project-details"></dl>
        <a href="index.html">Edit project information</a>
    </section>

    <label for="product-line">Product Line</label>
    <select id="product-line">
        <option value="IEC">IEC</option>
        <option value="DTC">DTC</option>
    </select>

    <label for="Capacity">Required Capacity (MBH)</label>
    <input id="Capacity" type="number" min="1">

    <label for="Refrigerant">Refrigerant</label>
    <select id="Refrigerant">
        <option value="R717">R717</option>
        <option id="r22-option" value="R22">R22</option>
    </select>

    <label for="Condensing Temperature">Condensing Temperature (°F)</label>
    <input id="Condensing Temperature" type="number">

    <label for="Wet Bulb Temperature">Wet Bulb Temperature (°F)</label>
    <input id="Wet Bulb Temperature" type="number">

    <label for="Motor Voltage">Motor Voltage</label>
    <select id="Motor Voltage">
        <option value="460/3/60">460/3/60</option>
        <option value="575/3/60">575/3/60</option>
    </select>

    <label>Upper Capacity Tolerance (%)</label>
    <input id="Upper Tolerance" type="number" value="10" min="0" step="any">

    <label>Lower Capacity Tolerance (%)</label>
    <input id="Lower Tolerance" type="number" value="-10" min="-100" max="0" step="any">

    <div class="action-bar">
        <button type="button" onclick="findUnit()">Find Unit</button>
        <button id="add-to-quote" type="button" disabled>Add to Quote</button>
    </div>

    <div id="result" class="result">
        Enter design conditions and click Find Unit.
    </div>
</div>

function interpolateFromPoints(points, value) {
    let lowerIndex = 0;
    const upperIndex = points.findIndex(point => point.x >= value);

    if (upperIndex === -1) {
        lowerIndex = points.length - 2;
    } else if (upperIndex > 0) {
        lowerIndex = upperIndex - 1;
    }

    const lower = points[lowerIndex];
    const upper = points[lowerIndex + 1];
    const proportion = (value - lower.x) / (upper.x - lower.x);
    return lower.y + proportion * (upper.y - lower.y);
}

function getCorrectionFactor(condensingTemperature, wetBulbTemperature) {
    const factorsByCondensingTemperature = correctionFactorRows.map(row => {
        const points = row.factors
            .map((factor, index) => ({ x: wetBulbTemperatures[index], y: factor }))
            .filter(point => point.y !== null);
        return {
            x: row.condensingTemperature,
            y: interpolateFromPoints(points, wetBulbTemperature)
        };
    });

    return interpolateFromPoints(factorsByCondensingTemperature, condensingTemperature);
}

let matchingUnits = [];
let sortKey = "capacityPercent";
let sortDirection = "asc";
let currentResultDetails;
let selectedUnitModel = null;
let activeProductLine = "IEC";
const quoteUnitNumber = Number(new URLSearchParams(window.location.search).get("unit"));
const productLineSelect = document.getElementById("product-line");
const refrigerantSelect = document.getElementById("Refrigerant");
const r22Option = document.getElementById("r22-option");

const iecResultColumns = [
    { key: "model", label: "Model", type: "string" },
    { key: "capacityPercent", label: "Capacity", unit: "%", type: "number" },
    { key: "baseHor", label: "Base HOR", unit: "MBH", type: "number" },
    { key: "correctedHor", label: "Corrected HOR", unit: "MBH", type: "number" },
    { key: "airFlowCfm", label: "Air Flow", unit: "CFM", type: "number" },
    { key: "fanMotor", label: "Fan Motor", unit: "HP", type: "string" },
    { key: "internalCoilVolume", label: "Internal Coil Volume", unit: "ft^3", type: "number" },
    { key: "r717ChargeLb", label: "R717 Charge", unit: "lb", type: "number" }
];

const dtcResultColumns = [
    { key: "model", label: "Model", type: "string" },
    { key: "nominalSize", label: "Nominal Size", type: "string" },
    { key: "r717Tons", label: "Rated R717 Capacity", unit: "Tons", type: "number" },
    ...iecResultColumns.slice(1)
];

function getResultColumns() {
    return activeProductLine === "DTC" ? dtcResultColumns : iecResultColumns;
}

function setProductLine(productLine) {
    activeProductLine = productLine === "DTC" ? "DTC" : "IEC";
    productLineSelect.value = activeProductLine;
    r22Option.disabled = activeProductLine === "DTC";
    if (activeProductLine === "DTC") refrigerantSelect.value = "R717";
}

function renderMatchingUnits(result) {
    const { minimumCapacity, maximumCapacity, correctionFactor } = currentResultDetails;
    const resultColumns = getResultColumns();
    const column = resultColumns.find(item => item.key === sortKey) ?? resultColumns[0];
    const directionMultiplier = sortDirection === "asc" ? 1 : -1;
    const sortedUnits = [...matchingUnits].sort((a, b) => {
        const aValue = a[sortKey];
        const bValue = b[sortKey];

        if (aValue == null || bValue == null) {
            return aValue == null ? (bValue == null ? 0 : 1) : -1;
        }

        const comparison = column.type === "number"
            ? aValue - bValue
            : String(aValue).localeCompare(String(bValue), undefined, { numeric: true });
        return comparison * directionMultiplier;
    });

    result.innerHTML = `
        <h3>Matching Units</h3>
        <p>Capacity range: ${minimumCapacity.toLocaleString()}–${maximumCapacity.toLocaleString()} MBH</p>
        <p>Correction factor: ${correctionFactor.toFixed(3)}</p>
        ${sortedUnits.length
            ? `<table>
                <thead><tr>${resultColumns.map(item => {
                    const isSorted = item.key === sortKey;
                    const heading = item.unit
                        ? `${item.label}<br><span class="table-unit">(${item.unit})</span>`
                        : item.label;
                    const indicator = isSorted ? (sortDirection === "asc" ? " ▲" : " ▼") : "";
                    return `<th scope="col" aria-sort="${isSorted ? (sortDirection === "asc" ? "ascending" : "descending") : "none"}"><button type="button" data-sort-key="${item.key}" aria-label="Sort by ${item.label}, ${isSorted ? (sortDirection === "asc" ? "ascending" : "descending") : "ascending"}">${heading}${indicator}</button></th>`;
                }).join("")}</tr></thead>
                <tbody>${sortedUnits.map(unit =>
                    `<tr data-unit-model="${unit.model}" tabindex="0" aria-selected="${unit.model === selectedUnitModel}">${resultColumns.map(item => {
                        const value = unit[item.key];
                        const displayValue = item.key === "capacityPercent"
                            ? `${value.toFixed(1)}%`
                            : typeof value === "number"
                                ? value.toLocaleString(undefined, { maximumFractionDigits: item.key === "baseHor" || item.key === "correctedHor" ? 0 : 1 })
                                : value ?? "N/A";
                        return `<td>${displayValue}</td>`;
                    }).join("")}</tr>`
                ).join("")}</tbody>
            </table>`
            : "<p>No units match the selected capacity range.</p>"}
    `;
    document.getElementById("add-to-quote").disabled =
        !selectedUnitModel || !Number.isInteger(quoteUnitNumber) || quoteUnitNumber < 1 || quoteUnitNumber > 8;
}

document.getElementById("result").addEventListener("click", event => {
    const button = event.target.closest("button[data-sort-key]");
    if (button) {
        const selectedKey = button.dataset.sortKey;
        if (selectedKey === sortKey) {
            sortDirection = sortDirection === "asc" ? "desc" : "asc";
        } else {
            sortKey = selectedKey;
            sortDirection = "asc";
        }

        renderMatchingUnits(document.getElementById("result"));
        return;
    }

    const row = event.target.closest("tbody tr[data-unit-model]");
    if (row) selectMatchingUnit(row.dataset.unitModel);
});

document.getElementById("result").addEventListener("keydown", event => {
    if ((event.key === "Enter" || event.key === " ") &&
        event.target.matches("tbody tr[data-unit-model]")) {
        event.preventDefault();
        selectMatchingUnit(event.target.dataset.unitModel);
    }
});

productLineSelect.addEventListener("change", () => {
    setProductLine(productLineSelect.value);
    selectedUnitModel = null;
    matchingUnits = [];
    currentResultDetails = null;
    sortKey = "capacityPercent";
    sortDirection = "asc";
    document.getElementById("add-to-quote").disabled = true;
    document.getElementById("result").textContent =
        `Enter design conditions and click Find Unit to search ${activeProductLine} models.`;
});

for (const input of document.querySelectorAll("#Capacity, #Refrigerant, #Condensing\\ Temperature, #Wet\\ Bulb\\ Temperature, #Motor\\ Voltage, #Upper\\ Tolerance, #Lower\\ Tolerance")) {
    for (const eventName of ["input", "change"]) {
        input.addEventListener(eventName, () => {
            if (!selectedUnitModel) return;
            selectedUnitModel = null;
            if (currentResultDetails) renderMatchingUnits(document.getElementById("result"));
        });
    }
}

function selectMatchingUnit(model) {
    selectedUnitModel = model;
    renderMatchingUnits(document.getElementById("result"));
}

document.getElementById("add-to-quote").addEventListener("click", () => {
    const selectedUnit = matchingUnits.find(unit => unit.model === selectedUnitModel);
    if (!selectedUnit || !Number.isInteger(quoteUnitNumber) || quoteUnitNumber < 1 || quoteUnitNumber > 8) {
        return;
    }

    try {
        const pricing = window.selectSgsProductPricing?.models?.[selectedUnit.model];
        if (!pricing || !Number.isFinite(pricing.basePrice)) {
            const result = document.getElementById("result");
            const message = document.createElement("p");
            message.setAttribute("role", "alert");
            message.textContent = `Pricing is unavailable for model ${selectedUnit.model}. Refresh the page or contact support.`;
            result.prepend(message);
            return;
        }
        const savedUnits = JSON.parse(sessionStorage.getItem("selectsgs-quoted-units") || "{}");
        const unitRows = JSON.parse(sessionStorage.getItem("selectsgs-unit-rows") || "[]");
        const unitRow = unitRows[quoteUnitNumber - 1] || {};
        savedUnits[quoteUnitNumber] = {
            ...selectedUnit,
            productLine: activeProductLine,
            price: pricing.basePrice,
            refrigerant: document.getElementById("Refrigerant").value,
            motorVoltage: document.getElementById("Motor Voltage").value,
            requiredCapacity: Number(document.getElementById("Capacity").value),
            condensingTemperature: Number(document.getElementById("Condensing Temperature").value),
            wetBulbTemperature: Number(document.getElementById("Wet Bulb Temperature").value),
            lowerTolerance: Number(document.getElementById("Lower Tolerance").value),
            upperTolerance: Number(document.getElementById("Upper Tolerance").value),
            searchSortKey: sortKey,
            searchSortDirection: sortDirection,
            location: unitRow.location || "",
            tag: unitRow.tag || ""
        };
        sessionStorage.setItem("selectsgs-quoted-units", JSON.stringify(savedUnits));
        window.location.href = `index.html?unit=${quoteUnitNumber}&added=1`;
    } catch (error) {
        const result = document.getElementById("result");
        const message = document.createElement("p");
        message.setAttribute("role", "alert");
        message.textContent = "The selected unit could not be added to the quote. Check your browser storage settings and try again.";
        result.prepend(message);
        console.error("Could not save selected unit to quote.", error);
    }
});

function findUnit() {

    selectedUnitModel = null;
    document.getElementById("add-to-quote").disabled = true;
    const capacity = Number(document.getElementById("Capacity").value);
    const condensingTemperatureInput = document.getElementById("Condensing Temperature").value;
    const wetBulbTemperatureInput = document.getElementById("Wet Bulb Temperature").value;
    const condensingTemperature = Number(condensingTemperatureInput);
    const wetBulbTemperature = Number(wetBulbTemperatureInput);
    const lowerTolerance = Number(document.getElementById("Lower Tolerance").value);
    const upperTolerance = Number(document.getElementById("Upper Tolerance").value);
    const result = document.getElementById("result");

    if (!Number.isFinite(capacity) || capacity <= 0 ||
        condensingTemperatureInput.trim() === "" || !Number.isFinite(condensingTemperature) ||
        wetBulbTemperatureInput.trim() === "" || !Number.isFinite(wetBulbTemperature) ||
        !Number.isFinite(lowerTolerance) || !Number.isFinite(upperTolerance) ||
        lowerTolerance < -100 || lowerTolerance > 0 ||
        upperTolerance < 0 || lowerTolerance > upperTolerance) {
        result.textContent =
            "Enter a capacity greater than zero, valid CT and WB values, a lower tolerance from -100% to 0%, and a nonnegative upper tolerance.";
        return;
    }

    const correctionFactor = getCorrectionFactor(condensingTemperature, wetBulbTemperature);
    const minimumCapacity = capacity * (1 + lowerTolerance / 100);
    const maximumCapacity = capacity * (1 + upperTolerance / 100);
    const availableUnits = activeProductLine === "DTC" ? window.dtcUnits : iecUnits;
    if (!Array.isArray(availableUnits) || availableUnits.length === 0) {
        result.textContent = `${activeProductLine} model ratings could not be loaded. Refresh the page and try again.`;
        return;
    }
    matchingUnits = availableUnits
        .map(unit => {
            const correctedHor = unit.baseHor / correctionFactor;
            const correctedCapacity = correctedHor;
            return {
                ...unit,
                ...(activeProductLine === "IEC" ? unitSpecifications.get(unit.model) : {}),
                ...(activeProductLine === "IEC" ? { r717ChargeLb: r717Charges.get(unit.model) } : {}),
                productLine: activeProductLine,
                correctedHor,
                capacityPercent: correctedCapacity / capacity * 100
            };
        })
        .filter(unit =>
            unit.correctedHor >= minimumCapacity &&
            unit.correctedHor <= maximumCapacity
        );

    selectedUnitModel = null;
    sortKey = "capacityPercent";
    sortDirection = "asc";
    currentResultDetails = { minimumCapacity, maximumCapacity, correctionFactor };
    renderMatchingUnits(result);
}

if (Number.isInteger(quoteUnitNumber) && quoteUnitNumber >= 1 && quoteUnitNumber <= 8) {
    try {
        const savedUnits = JSON.parse(sessionStorage.getItem("selectsgs-quoted-units") || "{}");
        const savedUnit = savedUnits[quoteUnitNumber];
        if (savedUnit) {
            setProductLine(savedUnit.productLine);
            document.getElementById("Capacity").value = String(savedUnit.requiredCapacity ?? "");
            document.getElementById("Refrigerant").value = savedUnit.refrigerant ?? "R717";
            document.getElementById("Condensing Temperature").value = String(savedUnit.condensingTemperature ?? "");
            document.getElementById("Wet Bulb Temperature").value = String(savedUnit.wetBulbTemperature ?? "");
            document.getElementById("Motor Voltage").value = savedUnit.motorVoltage ?? "460/3/60";
            document.getElementById("Lower Tolerance").value = String(savedUnit.lowerTolerance ?? -10);
            document.getElementById("Upper Tolerance").value = String(savedUnit.upperTolerance ?? 10);

            findUnit();
            if (matchingUnits.some(unit => unit.model === savedUnit.model)) {
                selectedUnitModel = savedUnit.model;
                sortKey = getResultColumns().some(column => column.key === savedUnit.searchSortKey)
                    ? savedUnit.searchSortKey
                    : "capacityPercent";
                sortDirection = savedUnit.searchSortDirection === "desc" ? "desc" : "asc";
                renderMatchingUnits(document.getElementById("result"));
            }
        }
    } catch (error) {
        const result = document.getElementById("result");
        result.textContent = "The saved unit design could not be restored. Enter the design conditions and click Find Unit.";
        console.error("Could not restore saved unit design.", error);
    }
}

try {
    const unitNumber = Number(new URLSearchParams(window.location.search).get("unit"));
    if (Number.isInteger(unitNumber) && unitNumber >= 1 && unitNumber <= 8) {
        const unitRows = JSON.parse(sessionStorage.getItem("selectsgs-unit-rows") || "[]");
        const unit = unitRows[unitNumber - 1] || {};

        target.textContent = `Selecting equipment for unit ${unitNumber}${unit.location ? ` — ${unit.location}` : ""}${unit.tag ? ` (${unit.tag})` : ""}.`;
        target.hidden = false;

    const savedProject = sessionStorage.getItem("selectsgs-project");
    if (savedProject) {
        const project = JSON.parse(savedProject);
        const details = document.getElementById("project-details");
        const labels = {
            customer: "Customer",
            projectName: "Project Name",
            contact: "Contact",
            quoteNumber: "Quote #",
            preparedBy: "Prepared by",
            projectType: "New/Replacement",
            salesTerritory: "Sales Territory",
            expectedClose: "Expected Close",
            probability: "Probability",
            probabilityComment: "Probability comment",
            bidStatus: "Bid Status",
            bidStatusComment: "Bid Status comment"
        };

        for (const [key, label] of Object.entries(labels)) {
            if (!project[key]) continue;

            const term = document.createElement("dt");
            term.textContent = label;
            const description = document.createElement("dd");
            description.textContent = key === "expectedClose"
                ? new Date(`${project[key]}T00:00:00`).toLocaleDateString()
                : key === "probability" ? `${project[key]}%` : project[key];
            details.append(term, description);
        }

        document.getElementById("project-summary").hidden = false;
    }
} catch (error) {
    const summary = document.getElementById("project-summary");
    const message = document.createElement("p");
    message.textContent = "Project information could not be loaded from this browser. Return to the project information page and try again.";
    summary.append(message);
    summary.hidden = false;
    console.error("Could not read saved project information.", error);
}
